<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 594" width="100%" height="100%">
  <defs>
    <!-- Paper gradient -->
    <linearGradient id="paperBgWeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffefb"/>
      <stop offset="100%" stop-color="#faf8f3"/>
    </linearGradient>
    <!-- Gold gradient for Garuda -->
    <linearGradient id="goldEmblemWeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Sheet Base -->
  <rect width="420" height="594" rx="8" fill="url(#paperBgWeb)"/>

  <!-- Ornate Navy Border Frame -->
  <g stroke="#1e3a8a">
    <!-- Outer thick border -->
    <rect x="16" y="16" width="388" height="562" rx="4" fill="none" stroke-width="4.5"/>
    <!-- Inner dashed border -->
    <rect x="23" y="23" width="374" height="548" rx="3" fill="none" stroke-width="1" stroke-dasharray="3,1.5"/>
    <!-- Inner thin border -->
    <rect x="27" y="27" width="366" height="540" rx="2" fill="none" stroke-width="0.8"/>

    <!-- Corner Ornaments (Top Left) -->
    <path d="M 16 48 C 28 48 48 28 48 16" fill="none" stroke-width="2"/>
    <path d="M 23 44 C 31 44 44 31 44 23" fill="none" stroke-width="1"/>
    <circle cx="34" cy="34" r="3" fill="#1e3a8a"/>

    <!-- Corner Ornaments (Top Right) -->
    <path d="M 404 48 C 392 48 372 28 372 16" fill="none" stroke-width="2"/>
    <path d="M 397 44 C 389 44 376 31 376 23" fill="none" stroke-width="1"/>
    <circle cx="386" cy="34" r="3" fill="#1e3a8a"/>

    <!-- Corner Ornaments (Bottom Left) -->
    <path d="M 16 546 C 28 546 48 566 48 578" fill="none" stroke-width="2"/>
    <path d="M 23 550 C 31 550 44 563 44 571" fill="none" stroke-width="1"/>
    <circle cx="34" cy="560" r="3" fill="#1e3a8a"/>

    <!-- Corner Ornaments (Bottom Right) -->
    <path d="M 404 546 C 392 546 372 566 372 578" fill="none" stroke-width="2"/>
    <path d="M 397 550 C 389 550 376 563 376 571" fill="none" stroke-width="1"/>
    <circle cx="386" cy="560" r="3" fill="#1e3a8a"/>
  </g>

  <!-- Gold Emblem (Garuda Pancasila stylized) -->
  <g transform="translate(210, 52)">
    <circle cx="0" cy="0" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <!-- Wings & Body -->
    <path d="M 0,-9 C -4,-13 -10,-10 -13,-4 C -9,2 -3,7 0,10 C 3,7 9,2 13,-4 C 10,-10 4,-13 0,-9 Z" fill="url(#goldEmblemWeb)"/>
    <!-- Shield -->
    <path d="M -4,-2 L 4,-2 L 3,5 L 0,7 L -3,5 Z" fill="#991b1b" stroke="#fef3c7" stroke-width="0.7"/>
    <!-- Small star in center -->
    <polygon points="0,0 0.8,1.8 2.5,1.8 1.2,2.8 1.6,4.6 0,3.6 -1.6,4.6 -1.2,2.8 -2.5,1.8 -0.8,1.8" fill="#fde047"/>
  </g>

  <!-- Header Titles -->
  <text x="210" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="700" letter-spacing="1" fill="#475569">KEMENTERIAN HUKUM DAN HAK ASASI MANUSIA</text>
  <text x="210" y="89" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6" font-weight="700" letter-spacing="1.5" fill="#64748b">REPUBLIK INDONESIA</text>

  <text x="210" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" letter-spacing="0.8" fill="#0f172a">SERTIFIKAT</text>
  <text x="210" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="800" letter-spacing="1.2" fill="#0f172a">HAK KEKAYAAN INTELEKTUAL</text>

  <!-- Certificate Subtype -->
  <text x="210" y="142" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="800" letter-spacing="2" fill="#1e3a8a">PROGRAM KOMPUTER</text>

  <!-- Center Technical Line Drawing (Computer Screen with </>) -->
  <g transform="translate(210, 246)" stroke="#334155" stroke-linecap="round" stroke-linejoin="round">
    <!-- Monitor Outer Body -->
    <rect x="-48" y="-52" width="96" height="66" rx="5" fill="#ffffff" stroke-width="1.8"/>
    <!-- Monitor Bezel Line -->
    <rect x="-42" y="-46" width="84" height="50" rx="2" fill="#f8fafc" stroke-width="1"/>
    <!-- Web Camera dot -->
    <circle cx="0" cy="-49" r="1" fill="#64748b" stroke="none"/>

    <!-- Central Code Symbol </> -->
    <text x="0" y="-12" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="28" font-weight="700" fill="#334155" stroke="none">&lt;/&gt;</text>

    <!-- Monitor Stand -->
    <path d="M -8,14 L -10,32 L 10,32 L 8,14 Z" fill="#e2e8f0" stroke-width="1.4"/>
    <ellipse cx="0" cy="33" rx="22" ry="4" fill="#cbd5e1" stroke-width="1.4"/>
  </g>

  <!-- Lower Metadata Section -->
  <g transform="translate(42, 388)" font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <text x="0" y="0" font-size="6.5" font-weight="500" fill="#64748b">Nama Pemegang Hak :</text>
    <text x="0" y="11" font-size="7.5" font-weight="700" fill="#0f172a">Politeknik Elektronika Negeri Surabaya</text>

    <text x="0" y="32" font-size="6.5" font-weight="500" fill="#64748b">Judul Program :</text>
    <text x="0" y="43" font-size="7.5" font-weight="700" fill="#0f172a">Website Monitoring E-BIO PENS</text>
  </g>

  <!-- Bottom Verification: QR Code + Official Stamp -->
  <!-- QR Code (Left) -->
  <g transform="translate(42, 470)">
    <rect x="0" y="0" width="46" height="46" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Authentic QR matrix pattern -->
    <rect x="4" y="4" width="12" height="12" fill="#1e293b"/>
    <rect x="6" y="6" width="8" height="8" fill="#ffffff"/>
    <rect x="8" y="8" width="4" height="4" fill="#1e293b"/>

    <rect x="30" y="4" width="12" height="12" fill="#1e293b"/>
    <rect x="32" y="6" width="8" height="8" fill="#ffffff"/>
    <rect x="34" y="8" width="4" height="4" fill="#1e293b"/>

    <rect x="4" y="30" width="12" height="12" fill="#1e293b"/>
    <rect x="6" y="32" width="8" height="8" fill="#ffffff"/>
    <rect x="8" y="34" width="4" height="4" fill="#1e293b"/>

    <!-- Data modules -->
    <rect x="20" y="6" width="6" height="4" fill="#1e293b"/>
    <rect x="20" y="14" width="4" height="8" fill="#1e293b"/>
    <rect x="8" y="20" width="8" height="4" fill="#1e293b"/>
    <rect x="20" y="26" width="6" height="6" fill="#1e293b"/>
    <rect x="30" y="20" width="8" height="4" fill="#1e293b"/>
    <rect x="34" y="28" width="8" height="6" fill="#1e293b"/>
    <rect x="28" y="38" width="6" height="4" fill="#1e293b"/>
  </g>

  <!-- Official Circular Stamp & Signature (Right) -->
  <g transform="translate(325, 495)">
    <!-- Blue Stamp -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#2563eb" stroke-width="1.8" opacity="0.85"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-dasharray="2,1.5" opacity="0.85"/>
    <path d="M -18,-6 C -10,-12 10,-12 18,-6" fill="none" stroke="#2563eb" stroke-width="0.8" opacity="0.85"/>
    <text x="0" y="-12" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="4" font-weight="800" fill="#2563eb" letter-spacing="0.5" opacity="0.9">KEMENKUMHAM RI</text>
    <text x="0" y="17" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="4" font-weight="800" fill="#2563eb" letter-spacing="0.5" opacity="0.9">DITJEN KI</text>
    <circle cx="0" cy="2" r="7" fill="none" stroke="#2563eb" stroke-width="0.9" opacity="0.85"/>
    <polygon points="0,-1 1,1 3,1 1.5,2 2,4 0,3 -2,4 -1.5,2 -3,1 -1,1" fill="#2563eb" opacity="0.85"/>

    <!-- Digital Signature flourish overlay -->
    <path d="M -26,12 Q -12,-8 -2,4 T 14,-2 Q 22,-8 28,6" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -8,10 Q 4,14 18,8" fill="none" stroke="#1d4ed8" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
